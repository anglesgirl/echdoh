name: build-aar

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@latest

      - name: Initialize gomobile
        run: gomobile init

      - name: Bind echdoh.aar
        run: |
          go mod tidy
          gomobile bind -javapkg com.anglesgirl.echdoh -target=android -androidapi 26 -o echdoh.aar ./echdoh

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: echdoh-aar
          path: echdoh.aar
          retention-days: 14
